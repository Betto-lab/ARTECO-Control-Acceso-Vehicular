
name: ARTECO - Verificar AWS OIDC

on:
  push:
    branches:
      - development

permissions:
  id-token: write
  contents: read

jobs:
  verificar-aws:
    name: Verificar conexión con AWS
    runs-on: ubuntu-latest
    environment: dev

    steps:
      - name: Obtener código
        uses: actions/checkout@v4

      - name: Autenticación OIDC con AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: arteco-dev

      - name: Verificar identidad AWS
        run: aws sts get-caller-identity

        
      - name: Verificar acceso al estado de Terraform
        run: |
          aws s3api get-bucket-location --bucket arteco-tfstate-2026-48271
          aws s3api list-objects-v2 --bucket arteco-tfstate-2026-48271 --prefix arteco/dev/ --max-items 5


      - name: Instalar Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.16.4"

      - name: Inicializar backend remoto
        run: terraform -chdir=terraform init -input=false -reconfigure

      - name: Revisar plan de infraestructura DEV
        run: terraform -chdir=terraform plan -input=false -no-color -var-file=../environments/dev.tfvars

