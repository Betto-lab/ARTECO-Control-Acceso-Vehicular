name: ARTECO - Terraform DEV manual

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Operación controlada sobre DEV
        required: true
        type: choice
        options:
          - import-budget
          - apply
          - destroy
      confirmation:
        description: Escriba IMPORT, APPLY o DESTROY según la operación elegida
        required: true
        type: string

permissions:
  id-token: write
  contents: read

concurrency:
  group: terraform-dev
  cancel-in-progress: false

jobs:
  terraform-dev:
    name: Terraform ${{ inputs.operation }} en DEV
    if: github.ref == 'refs/heads/development'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: dev

    steps:
      - name: Validar confirmación manual
        shell: bash
        env:
          OPERATION: ${{ inputs.operation }}
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          set -euo pipefail

          case "$OPERATION" in
            import-budget)
              expected="IMPORT"
              ;;
            apply)
              expected="APPLY"
              ;;
            destroy)
              expected="DESTROY"
              ;;
            *)
              echo "Operación no permitida: $OPERATION"
              exit 1
              ;;
          esac

          if [[ "$CONFIRMATION" != "$expected" ]]; then
            echo "Confirmación inválida. Escriba exactamente $expected."
            exit 1
          fi

      - name: Obtener código
        uses: actions/checkout@v4

      - name: Autenticación OIDC con AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: arteco-dev-${{ inputs.operation }}

      - name: Verificar identidad AWS
        run: aws sts get-caller-identity

      - name: Instalar Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.16.4"

      - name: Inicializar backend remoto
        run: terraform -chdir=terraform init -input=false -reconfigure -backend-config=../environments/dev.backend.hcl

      - name: Importar presupuesto DEV existente
        if: inputs.operation == 'import-budget'
        run: |
          terraform -chdir=terraform import \
            -input=false \
            -var-file=../environments/dev.tfvars \
            'aws_budgets_budget.dev_monthly[0]' \
            '755909808380:ARTECO-Dev-Mensual-5USD'

      - name: Verificar plan después de importar presupuesto
        if: inputs.operation == 'import-budget'
        run: |
          terraform -chdir=terraform plan \
            -input=false \
            -no-color \
            -var-file=../environments/dev.tfvars

      - name: Crear plan exacto
        if: inputs.operation != 'import-budget'
        shell: bash
        env:
          OPERATION: ${{ inputs.operation }}
        run: |
          set -euo pipefail

          destroy_flag=""
          if [[ "$OPERATION" == "destroy" ]]; then
            destroy_flag="-destroy"
          fi

          terraform -chdir=terraform plan \
            -input=false \
            -no-color \
            $destroy_flag \
            -var-file=../environments/dev.tfvars \
            -out=tfplan

          terraform -chdir=terraform show -no-color tfplan

      - name: Ejecutar plan aprobado
        if: inputs.operation != 'import-budget'
        run: terraform -chdir=terraform apply -input=false -auto-approve tfplan

      - name: Instalar Ansible para publicar el frontend
        if: inputs.operation == 'apply'
        run: |
          python -m pip install --disable-pip-version-check ansible-core boto3 botocore
          ansible-galaxy collection install -r ansible/requirements.yml

      - name: Publicar frontend con Ansible
        if: inputs.operation == 'apply'
        shell: bash
        run: |
          set -euo pipefail

          frontend_bucket="$(terraform -chdir=terraform output -raw frontend_bucket_name)"
          api_url="$(terraform -chdir=terraform output -raw api_url)"
          distribution_id="$(terraform -chdir=terraform output -raw frontend_distribution_id)"

          ansible-playbook ansible/deploy_frontend.yml \
            -e "frontend_bucket=$frontend_bucket" \
            -e "api_url=$api_url" \
            -e "cloudfront_distribution_id=$distribution_id" \
            -e "environment=dev"
